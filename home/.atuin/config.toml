enter_accept = true
search_mode = "daemon-fuzzy"
filter_mode_shell_up_key_binding = "directory"
search_mode_shell_up_key_binding = "prefix"
style = "compact"
inline_height = 10

history_filter = [
  '^\s*(clear|pwd|exit|ls|lsa|ll|cd|cd \.\.|gst|gpl|gbr|gps|gf|git (status|pull|push|fetch|branch|stash list)|tmux( ls)?|fish|nu|zsh)\s*$',
  '^\s*git (add \.|stash( apply| pop)?|worktree list|diff|log)\s*$',
  '^\s*(ps|whoami|history|top|htop|btop|mise ls|which \S+|echo (hi|\$\S+))\s*$',
  '^\s*(fzf|nvim|vim|op|docker|\^?open \.|zed \.|code \.)\s*$',
  '^\s*cd [\w.-]+\s*$',
]

[search]
shells = "all"

[daemon]
enabled = true
autostart = true

[pty_proxy]
enabled = true

[output]
enabled = true

[threads]
capture = true

[ui]
columns = ["exit", "duration", "time", "host", "command"]

[security]
sensitive_files = [
  "~/.config/cursor/auth.json",
  "*.pass",
  "password",
  "credentials.toml",
  "rclone.conf",
]
