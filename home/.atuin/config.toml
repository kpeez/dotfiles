enter_accept = true
search_mode = "daemon-fuzzy"
filter_mode_shell_up_key_binding = "directory"
search_mode_shell_up_key_binding = "prefix"
style = "compact"

## Commands matching these regexes are not recorded.
## `atuin history prune` deletes old entries that match them.
history_filter = [
  # A bare word: a tool run with no arguments, an alias, or a typo. Nothing to recall.
  '^\s*[\w-]+\s*$',
  # A listing or status lookup with flags only, such as `uv tool list` or `rex whoami --json`.
  '^\s*[\w-]+( [\w-]+)? (ls|list|status|whoami|version|hosts)( --?[\w-]+)*\s*$',
  # A help-only command, including nested subcommands and output pipes.
  # Not -h (human-readable on df and du).
  '^\s*[^;&|\n]*\s--help(?:\s+2>&1)?(?:\s*\|\s*[^;&|\n]+)*\s*$',
  # A simple version check. Not -v (verbose on pytest and ssh).
  '^\s*\S+(\s+[^-\s]\S*)?\s+(--version|-V)\s*$',
  # A tool or plugin update or cleanup, such as `brew upgrade` or `claude plugin marketplace update x`.
  # The middle words are listed so that `git submodule update` stays.
  '^\s*(sudo )?[\w-]+( (plugin|marketplace|python|skills|extension|self))* (update|upgrade|self-update|cleanup)( [^\s;&|]+)*\s*$',
  # One path to cd, ls, or an editor; atuin already stores the directory.
  '^\s*(cd|ls|lsa|ll|l|la|ld|lf|lt|zed|code|cursor)( -r)? [\w./~-]+\s*$',
  # Git reflexes. Read-only subcommands take flags only, so `git branch -D main`
  # and `git push --force origin main` stay recorded.
  '^\s*git (status|diff|log|branch|stash (list|ls)|worktree (list|ls))( --?[\w-]+)*\s*$',
  '^\s*git (pull|fetch)( --?[\w-]+| origin| main)*\s*$',
  '^\s*git (push|psuh|add \.|stash( apply| pop)?)\s*$',
  # Other reflexes.
  '^\s*(gs main|\^?open \.|which \S+|echo (hi|\$\S+)|gh (pr|issue)( list| lsit)?)\s*$',
  '^\s*cswap(\s|$)',
  # Coding-agent CLI launches and session resumes.
  '^\s*(opencode|agy|claude|codex)( (-[ch]|--auto|--continue|--resume|--yolo|--full-auto|--dangerously-skip-permissions|--rc|resume( --last)?|rc|remote-control|agents))*\s*$',
  # mise maintenance.
  '^\s*mise( -C [^\s;&|]+)? ((run )?(sync|update)|upgrade|self-update|prune|doctor|reshim|trust)( [^\s;&|]+)*\s*$',
  '^\s*mise( -C [^\s;&|]+)? (install|installs|tasks|help|config ls)\s*$',
  '^\s*(sudo )?apt(-get)? (update|upgrade|autoremove)( -[a-zA-Z]+)*(\s*(;|&&)\s*(sudo )?apt(-get)? (update|upgrade|autoremove)( -[a-zA-Z]+)*)*\s*$',
  # The body of the Nu fzf keybinding, which Nu records as a command.
  '^\s*let fzf_opts = \(__fzf_defaults',
]

[search]
shells = "all"

[daemon]
enabled = true
autostart = true

[pty_proxy]
enabled = true

[output]
enabled = true

[threads]
enabled = true

[ui]
columns = ["time", { type = "host", width = 8 }, "duration", "command"]

[security]
sensitive_files = [
  "~/.config/cursor/auth.json",
  "*.pass",
  "password",
  "credentials.toml",
  "rclone.conf",
]
