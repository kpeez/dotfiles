# Start numbering at 1 for windows and panes.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep a long scrollback history.
set -g history-limit 10000

# Mouse support: select panes/windows, resize, and scroll in copy mode.
set -g mouse on

# Lower key sequence delay (nicer for Vim/Neovim in tmux).
set -sg escape-time 10
set -g focus-events on

# Closing the last window of a session jumps to another session instead of
# dropping out of tmux.
set -g detach-on-destroy off

# Splits open in the current pane's working directory.
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane movement.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast pane resizing with repeatable H/J/K/L.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Scratch shell in a popup, opened in the current pane's directory.
bind g display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# Copy mode. set-clipboard makes tmux emit OSC 52 to the attached terminal, so
# yanks reach the local clipboard on macOS, Linux and over ssh with no pbcopy
# or xclip dependency.
setw -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Terminal capabilities. tmux-256color plus the Tc override covers old tmux;
# terminal-features (3.2+) adds true colour, OSC 8 links and undercurl styles
# for Neovim diagnostics.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -as terminal-features ",*:RGB:hyperlinks:usstyle"

# Let programs in a pane (Neovim image previews, etc.) talk to the terminal.
set -g allow-passthrough on

# Report Ctrl/Shift-modified keys to programs that ask for them (3.2+). The
# xterm report format option only exists from 3.5.
set -s extended-keys on
%if #{>=:#{version},3.5}
set -s extended-keys-format xterm
%endif

# Zellij-style status bar in the terminal's own ANSI colours: session block
# left (yellow while the prefix is armed), window blocks, key hints and clock
# right. Window names show the directory while a shell is idle. Window blocks
# carry a [·N] suffix when the window holds more than one pane, so a split is
# visible in the status line as well as from the borders.
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=default"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#{?client_prefix,#[fg=black#,bg=yellow#,bold],#[fg=black#,bg=green#,bold]} #S #[default] "
set -g window-status-separator " "
set -g window-status-format "#[fg=white,bg=brightblack] #I #W#{?window_zoomed_flag,+,}#{?#{e|==:#{window_panes},1},,[·#{window_panes}]} #[default]"
set -g window-status-current-format "#[fg=black,bg=green,bold] #I #W#{?window_zoomed_flag,+,}#{?#{e|==:#{window_panes},1},,[·#{window_panes}]} #[default]"
set -g status-right "#[fg=yellow]-/| split  hjkl pane  c new  g popup  d detach#[default]  #[fg=black,bg=brightwhite] %a %d %b %H:%M #[default]"
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"
# tmux only draws borders on edges shared with another pane, so the top and
# bottom edges of the window get no frame; pane-border-status adds a titled
# strip on the bottom edge of every pane, which both labels each split and
# marks the window edge.
set -g pane-border-style "fg=white"
set -g pane-active-border-style "fg=green"
set -g pane-border-indicators both
# pane-border-format is intentionally blank: the strip is the frame, no label.
set -g pane-border-status bottom
set -g pane-border-format ""
set -g message-style "fg=black,bg=yellow"
set -g mode-style "fg=black,bg=brightwhite"
set -g popup-border-lines rounded

# Reload config quickly.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

source-file -q ~/.config/tmux/local.conf

# Session persistence via TPM (~/.tmux/plugins/tpm, cloned by hand, see README).
# resurrect saves windows, panes and cwds; continuum saves every 15 min and
# restores on server start. prefix C-s saves, prefix C-r restores by hand.
# Inert until TPM is cloned.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Must stay the last line.
if-shell '[ -f ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
