[settings]
self_update.auto = true
tool_update.global_auto = "24h"
github.credential_command = "MISE_OFFLINE=1 ~/.local/share/mise/shims/gh auth token"
idiomatic_version_file_enable_tools = ["node"]

[tools]
# Shell and terminal
atuin = "latest"
carapace = "latest"
oh-my-posh = "latest"
usage = "latest"
zoxide = "latest"
neovim = "latest"
# A new tmux client may refuse to attach to a running server of an older version.
tmux = { version = "latest", auto_update = false }

# Files and text
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
ripgrep = "latest"
tlrc = "latest"
"github:duckdb/duckdb" = "latest"

# Git and GitHub
gh = "latest"
git-lfs = "latest"
"github:schpet/linear-cli" = "latest"

# Languages and build
node = "24"
bun = { version = "latest", auto_update = false }
uv = "latest"
ruff = "latest"
"pipx:pyrefly" = "latest"
rust = "latest"
just = "latest"
shellcheck = "latest"
"github:tlaplus/tlaplus" = "latest"

# Documents
pandoc = "latest"
typst = "latest"
"github:tectonic-typesetting/tectonic" = "latest"
markdownlint-cli2 = "latest"
"npm:defuddle" = "latest"
"npm:knap" = "latest"

# Agents
"npm:@openai/codex" = "latest"
"npm:@github/copilot" = "latest"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:skills" = "latest"
"pipx:claude-swap" = "latest"

# ML and data
"pipx:huggingface-hub" = "latest"
"pipx:wandb" = "latest"
"pipx:dvc" = "latest"

# Cloud and services
aws = { version = "latest", symlink_bins = "true" }
op = "latest"
rclone = "latest"
supabase = "latest"
"npm:vercel" = "latest"

# Downloads
"pipx:yt-dlp" = { version = "latest", os = ["darwin"] }
"pipx:gallery-dl" = "latest"
"github:ludviglundgren/qbittorrent-cli" = "latest"

# System packages run first, with raw = true: apt asks for a password, and
# nothing may write over the prompt. Casks are left out: apps update
# themselves or prompt for updates.
[tasks.update]
description = "Update system packages, mise, tools, and plugins"
raw = true
dir = "{{ env.HOME }}/.dotfiles"
run = [
  '''
[ "$(mise settings get system_packages.managers 2>/dev/null)" != "[]" ] || exit 0
case "$(uname -s)" in
Darwin)
  mise bootstrap packages upgrade --manager brew --yes
  ;;
Linux)
  command -v apt-get >/dev/null || exit 0
  if [ ! -t 0 ] && ! sudo -n true 2>/dev/null; then
    echo "apt: SKIPPED, sudo needs a terminal for the password; run mise update in a terminal" >&2
    exit 0
  fi
  sudo apt-get update
  sudo apt-get upgrade --with-new-pkgs --yes
  [ ! -f /var/run/reboot-required ] || echo "apt: reboot required to finish the upgrade"
  ;;
esac
''',
  "mise self-update --yes",
  "mise upgrade --yes",
  "sh scripts/plugins.sh",
]
