[settings]
self_update.auto = true
tool_update.global_auto = "24h"
github.credential_command = "MISE_OFFLINE=1 ~/.local/share/mise/shims/gh auth token"
idiomatic_version_file_enable_tools = ["node"]

[tools]
# Shell and terminal
atuin = "latest"
carapace = "latest"
oh-my-posh = "latest"
usage = "latest"
zoxide = "latest"
neovim = "latest"
# A new tmux client may refuse to attach to a running server of an older version.
tmux = { version = "latest", auto_update = false }

# Files and text
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
ripgrep = "latest"
tlrc = "latest"
"github:duckdb/duckdb" = "latest"

# Git and GitHub
gh = "latest"
git-lfs = "latest"
"github:schpet/linear-cli" = "latest"

# Languages and build
node = "24"
bun = { version = "latest", auto_update = false }
uv = "latest"
ruff = "latest"
"pipx:pyrefly" = "latest"
rust = "latest"
just = "latest"
shellcheck = "latest"
"github:tlaplus/tlaplus" = "latest"

# Documents
pandoc = "latest"
typst = "latest"
"github:tectonic-typesetting/tectonic" = "latest"
markdownlint-cli2 = "latest"
"npm:defuddle" = "latest"
"npm:knap" = "latest"

# Agents
"npm:@openai/codex" = "latest"
"npm:@github/copilot" = "latest"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:skills" = "latest"
"pipx:claude-swap" = "latest"

# ML and data
"pipx:huggingface-hub" = "latest"
"pipx:wandb" = "latest"
"pipx:dvc" = "latest"

# Cloud and services
aws = { version = "latest", symlink_bins = "true" }
op = "latest"
rclone = "latest"
supabase = "latest"
"npm:vercel" = "latest"

# Downloads
"pipx:yt-dlp" = { version = "latest", os = ["darwin"] }
"pipx:gallery-dl" = "latest"
"github:ludviglundgren/qbittorrent-cli" = "latest"

# Casks are left out: apps update themselves or prompt for updates.
[tasks.update]
description = "Update mise, tools, Homebrew formulae, and plugins"
dir = "{{ env.HOME }}/.dotfiles"
run = [
  "mise self-update --yes",
  "mise upgrade --yes",
  'if [ "$(uname -s)" = Darwin ]; then mise bootstrap packages upgrade --manager brew --yes; fi',
  "sh scripts/plugins.sh",
]
