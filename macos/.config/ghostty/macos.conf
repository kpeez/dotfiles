# macOS only. Everything here is either macOS-specific or needs macOS.
# Ghostty bypasses the login shell, so nushell would otherwise get
# launchd's bare environment and fall back to ~/Library/Application Support.
# Set the XDG layout explicitly; Ghostty expands ~ in paths but not $VAR in env.
command = /opt/homebrew/bin/nu
env = XDG_CONFIG_HOME=/Users/kyle/.config
env = XDG_DATA_HOME=/Users/kyle/.local/share
env = XDG_CACHE_HOME=/Users/kyle/.cache

# Cmd is `super` on macOS.
keybind = super+n=new_window
keybind = super+t=new_tab

# splits
keybind = super+d=new_split:right
keybind = super+shift+d=new_split:down
keybind = super+alt+left=goto_split:left
keybind = super+alt+right=goto_split:right
keybind = super+alt+up=goto_split:top
keybind = super+alt+down=goto_split:bottom
keybind = super+shift+e=equalize_splits
keybind = super+shift+f=toggle_split_zoom

# Drop-down terminal from any app. A global keybind needs Ghostty to have
# Accessibility access (System Settings > Privacy & Security).
keybind = global:ctrl+grave_accent=toggle_quick_terminal

# Options that Ghostty supports only on macOS.
font-thicken = true
macos-titlebar-style = transparent
#macos-titlebar-style = tabs
macos-option-as-alt = true
window-save-state = always
# Only macOS has Ghostty auto-update.
auto-update-channel = tip
