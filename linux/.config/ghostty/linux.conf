# Linux only. The system nushell already defaults to the XDG layout, so this
# only pins the command.
command = /usr/bin/nu

# `super` is the Windows/logo key, and GNOME grabs it (super+d show desktop,
# super+n notifications, super+alt+arrows workspaces). Use ctrl+shift instead.
# Ghostty already defaults to ctrl+shift+n new window, ctrl+shift+t new tab,
# ctrl+shift+o split right, ctrl+shift+e split down, ctrl+shift+enter zoom.
# Its default ctrl+alt+arrows for split focus clash with GNOME workspaces,
# so move focus with ctrl+shift+h/j/k/l.
keybind = ctrl+shift+h=goto_split:left
keybind = ctrl+shift+l=goto_split:right
keybind = ctrl+shift+k=goto_split:up
keybind = ctrl+shift+j=goto_split:down
keybind = ctrl+shift+alt+e=equalize_splits
